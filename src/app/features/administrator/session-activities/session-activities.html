<lib-page-container>
  <lib-page-header title="sidemenu.session activities"></lib-page-header>

  <div class="flex flex-col gap-6">
    <div class="w-full" [formGroup]="searchForm">
      <lib-search (reset)="resetSearch()">
        <lib-textbox label="label.username" formControlName="username" [isSearching]="true" />
        <lib-date-range
          label="label.logged_in_date"
          formControlName="range_date"
          [isSearching]="true"
        />
        <lib-datepicker
          label="label.last_activity_date"
          formControlName="last_activity_date"
          [isSearching]="true"
        />
        <lib-dropdown
          label="label.status"
          formControlName="status"
          [options]="statusOptions()"
          [isSearching]="true"
        />
      </lib-search>
    </div>

    <div class="w-full">
      <lib-table
        [columns]="columns"
        [data]="data()"
        [loading]="loading()"
        actionType="DELETE"
        [showDeleteFn]="showDeleteFn"
        [totalRecords]="totalRecords()"
        [rows]="pageSize()"
        (onPageChange)="handlePageChange($event)"
        (onSort)="handleSort($event)"
        (onDelete)="handleDelete($event)"
      />
    </div>
  </div>
</lib-page-container>
