<lib-page-container>
  <lib-page-header title="sidemenu.system codes" />
  <div class="flex flex-col gap-6">
    <div class="w-full" [formGroup]="searchForm">
      <lib-search (reset)="resetSearch()">
        <lib-dropdown
          label="label.code_type"
          formControlName="code_type"
          [options]="codeTypesOptions()"
        />
        <lib-textbox label="label.code" formControlName="code" />
        <lib-textbox label="label.description" formControlName="description" />
      </lib-search>
    </div>

    <div class="flex justify-end">
      <lib-button type="ADD" (click)="addSystemCode()" />
    </div>

    <div class="w-full">
      <lib-table
        [columns]="columns()"
        [data]="systemCodes()"
        [loading]="loading()"
        [totalRecords]="totalRecords()"
        [rows]="pageSize()"
        actionType="EDIT_DELETE"
        (onPageChange)="handlePageChange($event)"
        (onSave)="onSave($event)"
        (onCancel)="onCancel($event)"
        (onDelete)="onDelete($event)"
        (onEdit)="onEdit($event)"
      />
    </div>
  </div>
</lib-page-container>
