<div class="px-4 md:px-0">
  <!-- Header -->
  <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <button
        type="button"
        (click)="goBack()"
        class="flex items-center justify-center w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-all shadow-sm"
      >
        <i class="pi pi-arrow-left text-sm"></i>
      </button>
      <div>
        <h1 class="text-3xl font-bold text-gray-900 leading-tight">
          {{ 'users.new_user_title' | transloco }}
        </h1>
      </div>
    </div>
  </div>

  <!-- Form Section -->
  <div class="w-full bg-white p-6 md:p-8 rounded-2xl border border-gray-200 shadow-sm">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <lib-textbox
          formControlName="fullname"
          label="label.full_name"
          placeholder="label.placeholders.full_name"
          [required]="true"
        />

        <lib-textbox
          formControlName="username"
          label="label.username"
          placeholder="label.placeholders.username"
          [required]="true"
        />

        <lib-textbox
          formControlName="id_no"
          label="label.id_no"
          placeholder="label.placeholders.id_no"
          type="IDNO"
          [required]="true"
        />

        <lib-textbox
          formControlName="email"
          label="label.email"
          placeholder="label.placeholders.email"
          type="email"
          [required]="true"
        />

        <lib-textbox
          formControlName="password"
          label="label.password"
          placeholder="label.placeholders.password"
          type="password"
          [required]="true"
        />

        <lib-dropdown
          formControlName="role_code"
          label="label.role"
          [options]="rolesOptions()"
          placeholder="label.placeholders.role"
          [required]="true"
        />
      </div>

      <!-- Footer Actions -->
      <!-- <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-100"> -->
      <div class="pt-4 border-t border-gray-100 flex justify-end gap-3 mt-4 md:col-span-2">
        <lib-button type="SAVE" [loading]="loading()" (click)="onSubmit()" />
      </div>
    </form>
  </div>
</div>
