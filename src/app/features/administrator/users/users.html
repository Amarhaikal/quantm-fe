<lib-page-container>
  <lib-page-header title="sidemenu.users" />

  <div class="flex flex-col gap-6">
    <!-- Search Form Section -->
    <div class="w-full" [formGroup]="searchForm">
      <lib-search (reset)="resetSearch()">
        <lib-textbox label="label.username" formControlName="username" />
        <lib-textbox label="label.full_name" formControlName="fullname" />
        <lib-dropdown label="label.role" formControlName="role" [options]="rolesOptions()" />
      </lib-search>
    </div>

    <!-- Action Button (Between Search and Table) -->
    <div class="flex justify-end">
      <lib-button type="ADD" (click)="addUser()" />
    </div>

    <!-- Table Section -->
    <div class="w-full">
      <lib-table
        [columns]="columns"
        [data]="users()"
        [loading]="loading()"
        [totalRecords]="totalRecords()"
        [rows]="pageSize()"
        actionType="DETAILS_DELETE"
        (onPageChange)="handlePageChange($event)"
        (onEdit)="onEdit($event)"
        (onDelete)="handleDelete($event)"
      />
    </div>
  </div>
</lib-page-container>
