@if (loading()) {
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
    @for (i of [1, 2, 3]; track i) {
      <div>
        <p-skeleton width="40%" class="mb-2" />
        <p-skeleton height="2rem" borderRadius="6px" />
      </div>
    }
  </div>
} @else {
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
    <lib-textbox label="label.full_name" [value]="customer()?.fullname" [disabled]="true" />

    <lib-textbox label="label.reg_no" [value]="customer()?.reg_no" [disabled]="true" />

    <lib-textbox
      label="label.customer_type"
      [value]="customer()?.customer_type?.description"
      [disabled]="true"
    />

    <lib-audit-info [data]="auditData()" class="md:col-span-2 mt-2" />
  </div>
}
