<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
  <lib-textbox
    label="label.full_name"
    formControlName="fullname"
    [required]="true"
    [maxLength]="80"
  />

  <lib-textbox label="label.id_no" formControlName="id_no" [maxLength]="12" [type]="'IDNO'" />
  <lib-textbox label="label.email" formControlName="email" [type]="'email'" />
  <lib-textbox label="label.phone_no" formControlName="phone_no" [type]="'PHONENO'" />

  @if (data() && data().id) {
    <lib-audit-info [data]="data()" />
  }

  <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-2">
    <lib-button type="CANCEL" (click)="cancel()" />
    <lib-button type="SAVE" [loading]="isSaving()" (click)="save()" />
  </div>
</form>
