<lib-page-container>
  <lib-page-header title="sidemenu.customers" />

  <div class="flex flex-col gap-6">
    <div class="w-full" [formGroup]="searchForm">
      <lib-search (reset)="resetSearch()">
        <lib-textbox label="label.full_name" formControlName="fullname" [isSearching]="true" />
        <lib-textbox label="label.reg_no" formControlName="reg_no" [isSearching]="true" />
        <lib-dropdown
          label="label.customer_type"
          formControlName="customer_type"
          [options]="customerTypeOptions()"
          [isSearching]="true"
        />
      </lib-search>
    </div>

    <div class="flex justify-end">
      <lib-button type="ADD" (click)="addCustomer()" />
    </div>

    <div class="w-full">
      <lib-table
        [columns]="columns"
        [data]="customers()"
        [loading]="loading()"
        actionType="EDIT_DELETE"
        [totalRecords]="totalRecords()"
        [rows]="pageSize()"
        [first]="(pageNo() - 1) * pageSize()"
        (onPageChange)="handlePageChange($event)"
        (onSort)="handleSort($event)"
        (onEdit)="onEdit($event)"
        (onDelete)="handleDelete($event)"
      />
    </div>
  </div>
</lib-page-container>
