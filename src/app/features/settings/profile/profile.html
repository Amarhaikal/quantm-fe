<div class="mx-auto">
  <!-- Header Section -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">My Profile</h1>
    <!-- <p class="text-gray-500">Manage your account settings and personal information</p> -->
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left Column: Avatar -->
    <div class="lg:col-span-1">
      <p-card styleClass="h-full border-none shadow-sm overflow-hidden">
        <div class="flex flex-col items-center p-6 bg-linear-to-br from-indigo-50 to-white">
          <div class="relative group cursor-pointer">
            @if (profileImageUrl()) {
              <img
                [src]="profileImageUrl()"
                alt="Profile photo"
                class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-md transition-transform group-hover:scale-105"
              />
            } @else {
              <p-avatar
                icon="pi pi-user"
                size="xlarge"
                shape="circle"
                styleClass="w-32! h-32! text-4xl! border-4 border-white shadow-md bg-indigo-100! text-indigo-600!"
              ></p-avatar>
            }
            <div
              class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
            >
              <i class="pi pi-camera text-white text-xl"></i>
            </div>
          </div>
          <h2 class="mt-4 text-xl font-semibold text-gray-800">
            {{ originalData?.shortname || 'New User' }}
          </h2>
          <span class="text-sm text-gray-500">@{{ originalData?.username }}</span>
        </div>

        <div class="p-4 border-t border-gray-100">
          <div class="flex items-center gap-3 text-sm text-gray-600 mb-2">
            <i class="pi pi-shield"></i>
            <span>Verified Staff Account</span>
          </div>
          <div class="flex items-center gap-3 text-sm text-gray-600">
            <i class="pi pi-calendar"></i>
            <span>Joined August 2024</span>
          </div>
        </div>
      </p-card>
    </div>

    <!-- Right Column: Form -->
    <div class="lg:col-span-2">
      <p-card styleClass="border-none shadow-sm">
        <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="p-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
            <!-- Full Name -->
            <lib-textbox
              label="Full Name"
              formControlName="fullname"
              placeholder="Enter your full name"
              [required]="true"
              [maxLength]="80"
            />

            <!-- Short Name -->
            <lib-textbox
              label="Short Name"
              formControlName="shortname"
              placeholder="Enter your short name"
              [maxLength]="20"
            />

            <!-- Username (Readonly) -->
            <lib-textbox label="Username" formControlName="username" />

            <!-- ID No. -->
            <lib-textbox
              label="ID No."
              formControlName="id_no"
              type="IDNO"
              placeholder="000000-00-0000"
              [required]="true"
            />

            <!-- Gender -->
            <lib-dropdown
              label="Gender"
              formControlName="gender"
              [options]="genderOptions()"
              [required]="true"
            />

            <!-- Role -->
            <lib-dropdown
              label="Role"
              formControlName="role"
              [options]="rolesOptions()"
              [required]="true"
            />

            <!-- Status -->
            <lib-dropdown
              label="Status"
              formControlName="status"
              [options]="statusOptions()"
              [required]="true"
            />

            <!-- Email -->
            <lib-textbox
              label="Email"
              formControlName="email"
              placeholder="Enter your email"
              [required]="true"
            />

            <!-- Joined Date -->
            <lib-datepicker
              label="Joined Date"
              formControlName="joined_dt"
              placeholder="Select joined date"
            />

            <!-- Address 1 -->
            <lib-textbox
              label="Address 1"
              formControlName="address_line_1"
              placeholder="Enter your address"
              class="md:col-span-2"
              [maxLength]="255"
            />

            <!-- Address 2 -->
            <lib-textbox
              label="Address 2"
              formControlName="address_line_2"
              placeholder="Enter your address"
              class="md:col-span-2"
              [maxLength]="255"
            />

            <!-- City -->
            <lib-textbox
              label="City"
              formControlName="city"
              placeholder="Enter your city"
              [maxLength]="120"
            />

            <!-- State -->
            <lib-dropdown
              label="State"
              formControlName="state"
              placeholder="Select your state"
              [options]="statesOptions()"
            />

            <!-- Postcode -->
            <lib-textbox
              label="Postcode"
              formControlName="postcode"
              placeholder="Enter your postcode"
              [maxLength]="6"
            />

            <!-- Country -->
            <lib-dropdown
              label="Country"
              formControlName="country"
              placeholder="Select your country"
              [options]="countriesOptions()"
            />

            <!-- Action Buttons -->
            <div class="pt-4 border-t border-gray-100 flex justify-end gap-3 mt-4 md:col-span-2">
              <lib-button type="RESET" (click)="loadProfile()" />
              <lib-button type="SAVE_CHANGES" htmlType="submit" />
            </div>
          </div>
        </form>
      </p-card>
    </div>
  </div>
</div>
