<div
  class="flex gap-2 w-full"
  [class.flex-col]="effectiveLabelPosition() === 'top'"
  [class.flex-row]="effectiveLabelPosition() === 'left'"
  [class.items-start]="effectiveLabelPosition() === 'left'"
>
  @if (label()) {
    <label
      [for]="id()"
      class="text-sm font-medium text-gray-600 select-none"
      [class.w-1/3]="effectiveLabelPosition() === 'left'"
      [class.pt-2]="effectiveLabelPosition() === 'left'"
    >
      {{ label() | transloco }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }

  <div
    class="flex flex-col gap-2"
    [class.flex-1]="effectiveLabelPosition() === 'left'"
    [class.w-full]="effectiveLabelPosition() === 'top'"
  >
    <p-select
      [id]="id()"
      [options]="options()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="placeholder() | transloco"
      [ngModel]="displayValue()"
      (ngModelChange)="handleValueChange($event)"
      [filter]="filter"
      [disabled]="effectiveDisabled()"
      [showClear]="shouldShowClear()"
      [loading]="loading()"
      (onFocus)="handleFocus()"
      (onBlur)="handleBlur($event)"
      (onShow)="handleShow()"
      (onHide)="handleHide()"
      [appendTo]="'body'"
      styleClass="w-full h-9 rounded-lg! border border-gray-300! flex items-center shadow-none! text-sm!"
      panelStyleClass="lib-dropdown-panel"
      [class.bg-gray-100!]="effectiveDisabled()"
      [class.text-gray-500!]="effectiveDisabled()"
      [class.ng-invalid]="ngControl?.invalid && (ngControl?.dirty || ngControl?.touched)"
      [class.ng-dirty]="ngControl?.dirty"
    ></p-select>

    @if (ngControl?.invalid && (ngControl?.dirty || ngControl?.touched)) {
      <div class="flex flex-col gap-1">
        @if (ngControl?.errors?.['required']) {
          <small class="text-red-500 text-xs ml-1">This field is required</small>
        }
      </div>
    } @else if (hint()) {
      <small [id]="id() + '-help'" class="text-gray-400 text-xs ml-1">
        {{ hint() }}
      </small>
    }
  </div>
</div>
