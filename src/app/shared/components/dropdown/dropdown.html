<div class="flex flex-col gap-2 w-full">
  @if (label()) {
    <label [for]="id()" class="text-sm font-medium text-gray-600 select-none">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }

  <p-select
    [id]="id()"
    [options]="options()"
    optionLabel="label"
    optionValue="value"
    [placeholder]="placeholder()"
    [ngModel]="value()"
    (ngModelChange)="handleValueChange($event)"
    [filter]="filter()"
    [showClear]="showClear()"
    [loading]="loading()"
    (onBlur)="handleBlur($event)"
    [appendTo]="'body'"
    styleClass="w-full h-9 rounded-lg! border border-gray-300! flex items-center shadow-none!"
    panelStyleClass="lib-dropdown-panel"
    [class.bg-gray-50]="disabled()"
    [class.ng-invalid]="ngControl?.invalid && (ngControl?.dirty || ngControl?.touched)"
    [class.ng-dirty]="ngControl?.dirty"
  ></p-select>

  @if (ngControl?.invalid && (ngControl?.dirty || ngControl?.touched)) {
    <div class="flex flex-col gap-1">
      @if (ngControl?.errors?.['required']) {
        <small class="text-red-500 text-xs ml-1">This field is required</small>
      }
    </div>
  } @else if (hint()) {
    <small [id]="id() + '-help'" class="text-gray-400 text-xs ml-1">
      {{ hint() }}
    </small>
  }
</div>
