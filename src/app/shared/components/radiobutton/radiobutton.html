<div class="flex flex-col gap-2 w-full">
  @if (label()) {
    <label class="text-sm font-medium text-gray-600 select-none">
      {{ label() | transloco }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }

  <div class="flex flex-wrap gap-4 items-center">
    @for (option of options(); track option.value) {
      <div class="flex items-center gap-2">
        <p-radioButton
          [inputId]="id() + '-' + option.value"
          [name]="name()"
          [value]="option.value"
          [ngModel]="value()"
          (ngModelChange)="handleValueChange($event)"
          [disabled]="disabled()"
          [class.ng-invalid]="ngControl?.invalid && (ngControl?.dirty || ngControl?.touched)"
          [class.ng-dirty]="ngControl?.dirty"
        ></p-radioButton>
        <label
          [for]="id() + '-' + option.value"
          class="text-sm text-gray-700 cursor-pointer select-none"
        >
          {{ option.label | transloco }}
        </label>
      </div>
    }
  </div>

  @if (ngControl?.invalid && (ngControl?.dirty || ngControl?.touched)) {
    <div class="flex flex-col gap-1">
      @if (ngControl?.errors?.['required']) {
        <small class="text-red-500 text-xs ml-1">This field is required</small>
      }
    </div>
  } @else if (hint()) {
    <small [id]="id() + '-help'" class="text-gray-400 text-xs ml-1">
      {{ hint() }}
    </small>
  }
</div>
