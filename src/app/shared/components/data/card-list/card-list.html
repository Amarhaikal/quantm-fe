<div class="w-full">
  @if (loading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
      @for (i of [1, 2, 3, 4, 5, 6]; track $index) {
        <div class="p-4 border border-gray-200 rounded-xl bg-white shadow-sm h-48">
          <p-skeleton width="100%" height="100%" />
        </div>
      }
    </div>
  } @else if (data().length > 0) {
    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
      @for (item of data(); track $index) {
        <ng-container
          *ngTemplateOutlet="cardTemplate() || null; context: { $implicit: item }"
        ></ng-container>
      }
    </div>

    <!-- Paginator -->
    <p-paginator
      [first]="first()"
      [rows]="rows()"
      [totalRecords]="totalRecords()"
      [rowsPerPageOptions]="[10, 20, 30]"
      (onPageChange)="onPageChange.emit($event)"
      styleClass=""
    />
  } @else {
    <div
      class="flex items-center justify-center p-8 bg-white border border-gray-200 rounded-xl my-4"
    >
      <div class="flex flex-col items-center gap-2 text-gray-500">
        <i class="pi pi-inbox text-4xl mb-2 text-gray-300"></i>
        <span class="font-medium">{{ 'common.no_data_found' | transloco }}</span>
      </div>
    </div>
  }
</div>
