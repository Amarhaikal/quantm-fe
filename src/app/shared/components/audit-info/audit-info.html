@if (data() && translationsLoaded()) {
  <div class="mt-4">
    <!-- Divider with optional heading (commented out to match current Profile style) -->
    <!-- <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">
      {{ 'label.audit_information' | transloco }}
    </h3> -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-gray-100">
      <lib-textbox label="label.created_by" [value]="data()?.created_by" [disabled]="true" />
      <lib-textbox label="label.created_date" [value]="data()?.created_at" [disabled]="true" />
      <lib-textbox label="label.updated_by" [value]="data()?.updated_by || ''" [disabled]="true" />
      <lib-textbox
        label="label.updated_date"
        [value]="data()?.updated_at || ''"
        [disabled]="true"
      />
    </div>
  </div>
}
