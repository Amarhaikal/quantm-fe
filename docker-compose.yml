services:
  quantm-frontend:
    image: quantm-frontend:latest
    container_name: quantm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - quantm-network
    # Optional: If you want to mount config dynamically instead of copying it into the image
    # volumes:
    #   - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  quantm-network:
    name: quantm_network
